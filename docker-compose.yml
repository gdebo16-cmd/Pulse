services:
  pulse:
    build: .
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      PORT: 3001
      DATABASE_PATH: /app/data/pulse.db
      # Same-origin UI+API in the container; browser hits localhost:3001
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3001}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-env}
    volumes:
      - pulse-data:/app/data
    restart: unless-stopped

volumes:
  pulse-data:
